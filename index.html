<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let curvePoints = [];
let monitoring = false;

// Start Camera
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream);

// -------- CREATE SLIDERS --------
function createSliders(){

    curvePoints = [];
    const slidersDiv = document.getElementById("sliders");
    slidersDiv.innerHTML = "";

    let n = parseInt(document.getElementById("numPoints").value);

    for(let i=0;i<n;i++){

        let container = document.createElement("div");

        let x = document.createElement("input");
        x.type="range"; x.min=0; x.max=640;
        x.value=100+i*100;

        let y = document.createElement("input");
        y.type="range"; y.min=0; y.max=480;
        y.value=250;

        // 🔥 IMPORTANT: redraw when slider moves
        x.oninput = drawOverlay;
        y.oninput = drawOverlay;

        container.innerHTML = "Point "+(i+1)+" X ";
        container.appendChild(x);
        container.innerHTML += " Y ";
        container.appendChild(y);

        slidersDiv.appendChild(container);

        curvePoints.push({x,y});
    }

    drawOverlay(); // draw immediately
}

// -------- DRAW FUNCTION --------
function drawOverlay(){

    ctx.clearRect(0,0,640,480);

    if(curvePoints.length < 2) return;

    // Draw curve
    ctx.beginPath();
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;

    ctx.moveTo(curvePoints[0].x.value,
               curvePoints[0].y.value);

    for(let i=1;i<curvePoints.length;i++){
        ctx.lineTo(curvePoints[i].x.value,
                   curvePoints[i].y.value);
    }

    ctx.stroke();

    // Draw control points
    for(let p of curvePoints){
        ctx.beginPath();
        ctx.arc(p.x.value, p.y.value, 6, 0, 2*Math.PI);
        ctx.fillStyle = "red";
        ctx.fill();
    }
}

// -------- CONTINUOUS REFRESH LOOP --------
function animate(){
    ctx.clearRect(0,0,640,480);
    drawOverlay();
    requestAnimationFrame(animate);
}

animate();

createSliders();

</script>
