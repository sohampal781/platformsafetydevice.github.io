<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Virtual Yellow Line Monitor</title>

<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}

#cameraContainer{
    position:relative;
    width:640px;
    height:480px;
    margin:auto;
}

video, canvas{
    position:absolute;
    top:0;
    left:0;
}

canvas{
    pointer-events:none;
}

input{margin:5px;}
</style>
</head>

<body>

<h2>Metro Virtual Yellow Line</h2>

<div id="cameraContainer">
    <video id="video" width="640" height="480" autoplay muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
</div>

<br>

<label>Number of Curve Points:</label>
<input type="number" id="numPoints" min="2" max="10" value="3">
<button onclick="createSliders()">Create Points</button>

<div id="sliders"></div>

<script>
window.onload = function(){

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let curvePoints = [];

// Start Camera
navigator.mediaDevices.getUserMedia({video:true})
.then(stream => video.srcObject = stream);
window.createSliders = function(){

    curvePoints = [];
    const slidersDiv = document.getElementById("sliders");
    slidersDiv.innerHTML = "";

    let n = parseInt(document.getElementById("numPoints").value);

    for(let i=0;i<n;i++){

        let container = document.createElement("div");

        // Label
        let label = document.createElement("span");
        label.innerText = "Point " + (i+1) + " X ";
        container.appendChild(label);

        // X Slider
        let x = document.createElement("input");
        x.type = "range";
        x.min = 0;
        x.max = 640;
        x.value = 100 + i*100;
        x.addEventListener("input", drawOverlay);
        container.appendChild(x);

        // Y Label
        let labelY = document.createElement("span");
        labelY.innerText = " Y ";
        container.appendChild(labelY);

        // Y Slider
        let y = document.createElement("input");
        y.type = "range";
        y.min = 0;
        y.max = 480;
        y.value = 250;
        y.addEventListener("input", drawOverlay);
        container.appendChild(y);

        slidersDiv.appendChild(container);

        curvePoints.push({x,y});
    }

    drawOverlay();
};

// Draw Overlay
function drawOverlay(){

    ctx.clearRect(0,0,640,480);

    if(curvePoints.length < 2) return;

    ctx.beginPath();
    ctx.strokeStyle="yellow";
    ctx.lineWidth=4;

    ctx.moveTo(curvePoints[0].x.value,
               curvePoints[0].y.value);

    for(let i=1;i<curvePoints.length;i++){
        ctx.lineTo(curvePoints[i].x.value,
                   curvePoints[i].y.value);
    }

    ctx.stroke();

    // Draw control points
    for(let p of curvePoints){
        ctx.beginPath();
        ctx.arc(p.x.value, p.y.value, 6, 0, 2*Math.PI);
        ctx.fillStyle="red";
        ctx.fill();
    }
}

createSliders();

};
</script>

</body>
</html>
