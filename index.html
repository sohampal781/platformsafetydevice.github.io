<!DOCTYPE html>
<html>
<head>
<title>Metro Virtual Yellow Line Detection</title>
<style>
body { font-family: Arial; background: #111; color: white; text-align: center; }
canvas { border: 2px solid yellow; }
.controls { margin-top: 15px; }
.slider-container { margin: 5px; }
</style>
</head>
<body>

<h2>Metro Virtual Yellow Line Breach Detection</h2>

<video id="video" width="640" height="480" autoplay muted></video>
<canvas id="canvas" width="640" height="480"></canvas>

<div class="controls">
    <label>Number of Curve Points:</label>
    <input type="number" id="numPoints" min="2" max="10" value="3">
    <button onclick="createSliders()">Create Points</button>
    <div id="sliders"></div>
</div>

<h3 id="status">Status: Safe</h3>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');
const slidersDiv = document.getElementById('sliders');

let curvePoints = [];

// Start Camera
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream);

// Create Sliders
function createSliders() {
    slidersDiv.innerHTML = "";
    curvePoints = [];
    const n = parseInt(document.getElementById('numPoints').value);

    for(let i=0;i<n;i++){
        const container = document.createElement("div");
        container.className = "slider-container";

        const xSlider = document.createElement("input");
        xSlider.type = "range";
        xSlider.min = 0;
        xSlider.max = 640;
        xSlider.value = 100 + i*100;

        const ySlider = document.createElement("input");
        ySlider.type = "range";
        ySlider.min = 0;
        ySlider.max = 480;
        ySlider.value = 300;

        container.appendChild(document.createTextNode("Point "+(i+1)+" X "));
        container.appendChild(xSlider);
        container.appendChild(document.createTextNode(" Y "));
        container.appendChild(ySlider);

        slidersDiv.appendChild(container);

        curvePoints.push({xSlider, ySlider});
    }
}

// Draw everything
function drawCurve() {
    ctx.clearRect(0,0,640,480);
    ctx.drawImage(video,0,0,640,480);

    if(curvePoints.length < 2) return;

    ctx.beginPath();
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 3;

    ctx.moveTo(curvePoints[0].xSlider.value,
               curvePoints[0].ySlider.value);

    for(let i=1;i<curvePoints.length;i++){
        ctx.lineTo(curvePoints[i].xSlider.value,
                   curvePoints[i].ySlider.value);
    }
    ctx.stroke();
}

// Simple crossing detection (based on ankle position)
function checkBreach(landmarks){
    if(curvePoints.length < 2) return;

    const leftAnkle = landmarks[27];
    const x = leftAnkle.x * 640;
    const y = leftAnkle.y * 480;

    // Simple logic: if ankle below lowest curve Y → breach
    let minY = Math.min(...curvePoints.map(p => parseInt(p.ySlider.value)));

    if(y > minY){
        statusText.innerText = "⚠ BREACH DETECTED";
        statusText.style.color = "red";
    } else {
        statusText.innerText = "Status: Safe";
        statusText.style.color = "lightgreen";
    }
}

// MediaPipe Pose Setup
const pose = new Pose.Pose({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 0,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(results => {
    drawCurve();
    if(results.poseLandmarks){
        checkBreach(results.poseLandmarks);
    }
});

// Attach Camera to MediaPipe
const camera = new Camera(video, {
    onFrame: async () => {
        await pose.send({image: video});
    },
    width: 640,
    height: 480
});
camera.start();

createSliders();
</script>

</body>
</html>
